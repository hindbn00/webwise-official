<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WebWise Admin</title><link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#15286A;--deep:#0B1640;--teal:#1F8FB0;--ice:#EEF4FA;--ink:#0E1A3D;--mute:#5B6785;--line:#DCE4F0}
*{box-sizing:border-box;margin:0}body{font:400 16px/1.5 'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--ice)}
h1{font:800 1.5rem Montserrat,sans-serif;letter-spacing:-.02em}
header{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font:800 1.2rem Montserrat,sans-serif;color:var(--navy);text-decoration:none}.logo img{height:30px}.logo b{color:var(--teal)}
main{max-width:1180px;margin:0 auto;padding:32px 24px}
button{font:600 .95rem 'DM Sans',sans-serif;padding:10px 18px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--teal),var(--navy));color:#fff;cursor:pointer}
button.o{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
#lg{max-width:380px;margin:60px auto;background:#fff;border-radius:18px;padding:30px;display:grid;gap:14px;box-shadow:0 20px 50px -25px rgba(11,22,64,.4)}
label{display:grid;gap:6px;font-weight:600;font-size:.9rem}
input{font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#F8FAFD}input:focus{border-color:var(--teal);outline:none}
#er{color:#B3261E;font-size:.9rem;min-height:1.2em}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.top span{color:var(--mute);font:500 1rem 'DM Sans'}
.tw{overflow-x:auto;background:#fff;border-radius:14px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.95rem}
th{background:#F8FAFD;font-weight:600;color:var(--mute);font-size:.85rem}tr:last-child td{border-bottom:0}td a{color:var(--navy);font-weight:600}
.pk{display:inline-block;background:#E6F4F9;color:var(--navy);font-weight:600;border-radius:99px;padding:2px 10px;font-size:.85rem;white-space:nowrap}
.em{padding:34px;text-align:center;color:var(--mute)}
</style></head><body>
<header><a class="logo" href="/"><img src="/logo.png" alt="">Web<b>Wise</b> Admin</a><button class="o" id="out" hidden>Log out</button></header>
<main>
<form id="lg"><h1>Admin login</h1><label>Email<input id="em" type="email" autocomplete="username" required></label><label>Password<input id="pw" type="password" autocomplete="current-password" required></label><p id="er" role="alert"></p><button type="submit">Log in</button></form>
<section id="dash" hidden><div class="top"><h1>Bookings <span id="cnt"></span></h1><button class="o" id="rf">Refresh</button></div>
<div class="tw"><table><thead><tr><th>Date</th><th>Package</th><th>Name</th><th>Contact</th><th>About the business</th></tr></thead><tbody id="tb"></tbody></table></div></section>
</main>
<script>
var SUPABASE_URL="https://lzrvpbodrkwbsuqomzdl.supabase.co";      // paste your Supabase Project URL here
var SUPABASE_KEY="sb_publishable_dEOUxOVYzs7HBBQH4BrvWA_7b7Eqj24";      // paste your Supabase anon public key here
var $=function(i){return document.getElementById(i)},tok=null;
try{tok=sessionStorage.getItem("ww")}catch(e){}
function td(t){var c=document.createElement("td");c.textContent=t||"";return c}
function logout(){tok=null;try{sessionStorage.removeItem("ww")}catch(e){}show()}
function show(){$("lg").hidden=!!tok;$("dash").hidden=!tok;$("out").hidden=!tok;if(tok)load()}
function contact(r){var c=document.createElement("td"),d=r.contact_details||"",h=null;
  if(r.preferred_contact==="Email")h="mailto:"+encodeURIComponent(d);
  else if(r.preferred_contact==="WhatsApp")h="https://wa.me/"+d.replace(/\D/g,"");
  else if(r.preferred_contact==="Instagram")h="https://instagram.com/"+encodeURIComponent(d.replace(/^@/,""));
  c.appendChild(document.createTextNode((r.preferred_contact||"")+": "));
  if(h){var a=document.createElement("a");a.href=h;a.target="_blank";a.rel="noopener";a.textContent=d;c.appendChild(a)}else c.appendChild(document.createTextNode(d));return c}
function load(){
  fetch(SUPABASE_URL+"/rest/v1/leads?select=*&order=created_at.desc&limit=500",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+tok}})
  .then(function(r){if(r.status===401){logout();throw 0}return r.json()})
  .then(function(rows){var tb=$("tb");tb.textContent="";$("cnt").textContent="("+rows.length+")";
    if(!rows.length){var tr=document.createElement("tr"),c=td("No bookings yet.");c.colSpan=5;c.className="em";tr.appendChild(c);tb.appendChild(tr);return}
    rows.forEach(function(r){var tr=document.createElement("tr");
      tr.appendChild(td(new Date(r.created_at).toLocaleString()));
      var p=td("");var b=document.createElement("span");b.className="pk";b.textContent=r.plan||"-";p.appendChild(b);tr.appendChild(p);
      tr.appendChild(td(r.name));tr.appendChild(contact(r));tr.appendChild(td(r.message||"-"));tb.appendChild(tr)})})
  .catch(function(){})}
$("lg").onsubmit=function(e){e.preventDefault();$("er").textContent="";
  if(!SUPABASE_URL||!SUPABASE_KEY){$("er").textContent="Add your Supabase URL and key in this file first.";return}
  fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})})
  .then(function(r){return r.json().then(function(j){if(!r.ok||!j.access_token)throw 0;tok=j.access_token;try{sessionStorage.setItem("ww",tok)}catch(x){}$("pw").value="";show()})})
  .catch(function(){$("er").textContent="Wrong email or password."})};
$("out").onclick=logout;$("rf").onclick=load;show();
</script></body></html>
